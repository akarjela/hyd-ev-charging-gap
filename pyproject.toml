[project]
name = "hydgap"
version = "0.1.0"
description = "Charging-infrastructure gap analysis for electric two-wheelers in Hyderabad"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyproj>=3.7",
    "h3>=4.2",
    "scipy>=1.14",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.scripts]
hydgap = "hydgap.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.extend-per-file-ignores]
"src/hydgap/cli.py" = ["B008"]
